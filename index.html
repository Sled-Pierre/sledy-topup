async function hash(s){
  if(!(window.crypto&&crypto.subtle))return btoa(unescape(encodeURIComponent(s)));

async function payNow(id){
  if(!CONFIG.API){toast(t('noApi'));return}
  const os=LS('sledy_orders')||[],o=os.find(x=>x.id==id);if(!o||o.s!='pend')return;
  const g=grpOf(os,o,'pend'),tot=g.reduce((n,x)=>n+x.a+(x.fee||0),0);
  toast(t('vWait'));
  try{
    const r=await fetch(CONFIG.API+'/pay',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:o.grp||o.id,orderIds:g.map(x=>x.id),items:g.map(x=>x.it),method:o.pm,amount:tot,payerNumber:o.ph,description:g.map(x=>x.p+' - '+x.o).join(', '),returnUrl:location.href.split('#')[0].split('?')[0]})});
    const d=await r.json();if(!r.ok)throw 0;
    g.forEach(x=>{x.s='paid';x.ts=Date.now();if(d.ref)x.ref=d.ref});LS('sledy_orders',os);dash();
    if(d.url)location.assign(d.url);
  }catch(e){toast(t('payErr'))}
}
async function chkNow(id){
  await verify(id);const o=(LS('sledy_orders')||[]).find(x=>x.id==id);if(o&&o.s=='paid')toast(t('chkNo'));
}
setInterval(()=>{const u=me();if(!u||!CONFIG.API)return;(LS('sledy_orders')||[]).filter(o=>o.u==u.email&&o.s=='paid').forEach(o=>verify(o.id))},8000);
$('#cList').onclick=e=>{

  if(b.dataset.rm!==undefined)a.splice(+b.dataset.rm,1);
  else{const it=a[+b.dataset.ix];it.q=Math.max(1,Math.min(20,(it.q||1)+ +b.dataset.q))}

};
$('#cartBtn').onclick=()=>{

  $('#cErr').textContent='';drawCart();open('#cartOv');
};
$('#cGo').onclick=()=>{const a=cart();if(!a.length)return $('#cErr').textContent=t('emptyC');shut('#cartOv');openCo(a,'cart')};
const goRec=()=>{document.body.classList.remove('indash','inprod','inco');setTimeout(()=>$('#rec').scrollIntoView({behavior:'smooth'}),60)};
$('#recBtn').onclick=$('#recBtn2').onclick=$('#balBtn').onclick=goRec;
$('#back').onclick=()=>{document.body.classList.remove('indash');scrollTo(0,0)};
/* Admin helper: after you verify a payment, run sledyConfirm(index) in the console.
   Confirming a wallet order adds its amount to the user's balance. */
window.sledyConfirm=i=>{
  const os=LS('sledy_orders')||[],o=os[i];if(!o||o.s=='ok'||o.s=='cx')return;
  o.s='ok';o.ts=Date.now();
  if(o.k=='wal'){const us=LS('sledy_users');us[o.u].bal=(us[o.u].bal||0)+o.a;LS('sledy_users',us)}
  LS('sledy_orders',os);render();
};
document.querySelectorAll('.wa').forEach(a=>a.href='https://wa.me/'+WA);
document.querySelectorAll('footer a').forEach(a=>a.addEventListener('click',()=>document.body.classList.remove('indash')));

function stepper(o){
  const c=o.s=='pend'?1:o.s=='paid'?2:3;
  return `<ol class="stp4">${['stp1','stp2','stp3','stp4'].map((k,i)=>{const d=o.s=='ok'||i<c;return `<li class="${d?'done':i==c?'now':''}"><i>${d?'✓':i+1}</i><span>${t(k)}</span></li>`}).join('')}</ol>`;
}
function orderPanel(o){
  if(o.s=='cx')return '';
  let h=stepper(o);
  const os=LS('sledy_orders')||[],g=grpOf(os,o,o.s),tot=g.reduce((n,x)=>n+x.a+(x.fee||0),0),nm=o.pm=='Natcash'?'NatCash':o.pm;
  if(o.s=='pend'){
    h+=`<div class="wait2"><div class="wtop"><div><span class="note">${t('payTot')}${g.length>1?' ('+t('grpN').replace('%n',g.length)+')':''}</span><b class="wamt">${tot} HTG</b></div><div class="wmeth"><i class="mk ${o.pm=='Natcash'?'n':'m'}">${nm[0]}</i><span>${esc(nm)}<small>${esc(o.ph||'')}</small></span></div></div>`;
    h+=`<button class="btn payb" data-act="pay">${t('payNowB').replace('%m',nm)}</button><p class="note">${t('apiHint')}</p><div class="row"><button class="btn ghost" data-act="cx">${t('cancel')}</button></div></div>`;
  }else if(o.s=='paid'){
    h+=`<div class="wait2"><div class="vh"><span class="spin" aria-hidden="true"></span><b>${t('verT')}</b></div><p class="note">${t('verD')}</p>${o.ref?`<p class="note">${t('ref')}: ${esc(o.ref)}</p>`:''}${CONFIG.API?`<div class="row"><button class="btn ghost" data-act="chk">${t('chkB')}</button></div>`:''}</div>`;
  }
  return h;
}
let tab='sum';
function tabs(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab==tab));document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id=='tab-'+tab))}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;tabs()});
function dash(){
  const u=me();if(!u)return;
  document.body.classList.remove('inprod','inco');document.body.classList.add('indash');tabs();
  $('#av').textContent=u.email[0].toUpperCase();$('#hello').textContent=u.name;$('#dMail').textContent=u.email;
  $('#dBal').textContent=$('#dBal2').textContent=(u.bal||0)+' HTG';
  const all=(LS('sledy_orders')||[]).map((o,i)=>({...o,i})),os=all.filter(o=>o.u==u.email);
  const P=os.filter(o=>o.s=='pend'||o.s=='paid'),R=os.filter(o=>o.s=='ok'),X=os.filter(o=>o.s=='cx'),W=os.filter(o=>o.k=='wal');
  const spent=R.filter(o=>o.k!='wal').reduce((n,o)=>n+o.a,0);
  $('#stats').innerHTML=[[(u.bal||0)+' HTG','bal'],[P.length,'sPend'],[R.length,'sRecv'],[spent+' HTG','sSpent']].map(([v,k])=>`<div class="stat"><b>${v}</b><span>${t(k)}</span></div>`).join('');
  const card=o=>{
    const w=orderPanel(o);
    const re=o.s=='ok'&&o.k!='wal'&&o.it&&PR[o.k]?`<button class="btn ghost" data-act="re" style="margin:8px 0 0 8px">${t('re')}</button>`:'';
    return `<div class="oc" data-n="${o.i}"><div class="h"><div><b>${esc(o.p)}</b> - ${esc(o.o)}<small class="note" style="display:block">${esc(o.to)}${o.gn?' ('+esc(o.gn)+')':''} | ${esc(o.pm)} | ${esc(o.ph||'')} | ${esc(o.d)}</small></div><div style="text-align:right">${o.a} HTG<br><span class="chip ${o.s}">${t(o.s)}</span></div></div>${w}${o.s=='cx'?'':`<button class="btn ghost" data-act="rc" style="margin-top:8px">${o.s=='ok'?t('rcB'):t('slipT')}</button>`}${re}</div>`};
  const sec=(l,a)=>a.length?`<h4>${t(l)} (${a.length})</h4>`+a.map(card).join(''):'';
  const none=`<p class="note">${t('none')}</p>`;
  $('#orders').innerHTML=os.length?sec('ordP',P)+sec('ordR',R)+sec('ordX',X):none;
  $('#sumOrders').innerHTML=P.length?P.map(card).join(''):none;
  $('#walHist').innerHTML=W.length?W.map(card).join(''):none;
  nfRender();
}
const ordClick=e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const c=b.closest('.oc'),os=LS('sledy_orders'),o=os[+c.dataset.n],a=b.dataset.act;
  if(a=='rc')return showReceipt([o]);
  if(a=='pay')return payNow(o.id);
  if(a=='chk')return chkNow(o.id);
  if(a=='re'){setCart([...cart(),o.it]);return toast(t('added'))}
  if(a=='cx'){o.s='cx';o.ts=Date.now()}
  LS('sledy_orders',os);dash();
};
$('#orders').onclick=$('#sumOrders').onclick=$('#walHist').onclick=ordClick;
$('#dashBtn').onclick=dash;
$('#logo').onclick=()=>document.body.classList.remove('indash','inprod','inco');
$('#out').onclick=()=>{localStorage.removeItem('sledy_session');document.body.classList.remove('indash');render()};
$('#pinChg').onclick=()=>$('#pinBox').classList.toggle('dim');
$('#pinSave').onclick=async()=>{
  const n=$('#newPin').value,u=me();
  if(!/^\d{4,6}$/.test(n))return toast(t('errP'));
  if(weakPin(n))return toast(t('errPinW'));
  const users=LS('sledy_users');users[u.email].pin=await hash(u.email+'pin'+n);LS('sledy_users',users);
  $('#newPin').value='';$('#pinBox').classList.add('dim');toast(t('pinOk'));
};

document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>shut('#'+b.closest('.ov').id));

$('#q').oninput=filter;
function filter(){
  const q=$('#q').value.trim().toLowerCase();let any=false;
  document.querySelectorAll('.card').forEach(c=>{const m=!q||c.dataset.s.includes(q);c.classList.toggle('dim',!m);if(m)any=true});
  document.querySelectorAll('#sections .grid').forEach(el=>{const vis=!!el.querySelector('.card:not(.dim)');el.classList.toggle('dim',!vis);el.previousElementSibling.classList.toggle('dim',!vis)});
  $('#noRes').classList.toggle('dim',any);
}

$('#pwGo').onclick=async()=>{
  const u=me(),cp=$('#curPw').value,nw=$('#newPw').value;
  if(u.pw!==await hash(u.email+cp))return toast(t('errCur'));
  if(!strong(nw))return toast(t('errWeak'));
  const us=LS('sledy_users');us[u.email].pw=await hash(u.email+nw);LS('sledy_users',us);
  $('#curPw').value=$('#newPw').value='';toast(t('pwOk'));
};
$('#delBtn').onclick=async()=>{
  const u=me();
  if(u.pw!==await hash(u.email+$('#curPw').value))return toast(t('errCur'));
  if(!confirm(t('delQ')))return;
  const us=LS('sledy_users');delete us[u.email];LS('sledy_users',us);
  LS('sledy_orders',(LS('sledy_orders')||[]).filter(o=>o.u!=u.email));
  localStorage.removeItem('sledy_cart_'+u.email);localStorage.removeItem('sledy_session');
  document.body.classList.remove('indash');$('#curPw').value='';render();toast(t('delOk'));
};
const nfRead=()=>{const u=me();return u?(LS('sledy_nread_'+u.email)||[]):[]};
function nfList(){
  const u=me();if(!u)return[];const rd=nfRead();
  return (LS('sledy_orders')||[]).filter(o=>o.u==u.email&&o.id).map(o=>({o,key:o.id+':'+o.s,ts:o.ts||parseInt(o.id.slice(0,8),36)||0})).map(x=>({...x,un:!rd.includes(x.key)})).sort((a,b)=>b.ts-a.ts);
}
const NK={pend:'nPend',paid:'nPaid',ok:'nOk',cx:'nCx'};
const nfHtml=l=>l.length?l.map(x=>`<button class="nfi${x.un?' u':''}" data-o="${x.o.id}" data-k="${x.key}"><b>${esc(x.o.p)}</b><span>${t(NK[x.o.s])}</span><small>${new Date(x.ts).toLocaleString()}</small></button>`).join(''):`<p class="note" style="padding:10px">${t('nfNone')}</p>`;
let nfSeen=null;
function nfRender(){
  const u=me(),l=nfList(),un=l.filter(x=>x.un).length;
  $('#nfw').classList.toggle('dim',!u);$('#nfN').textContent=un;$('#nfN').classList.toggle('dim',!un);
  $('#nfMenu').innerHTML=`<div class="nfh"><b>${t('nfT')}</b><button class="btn ghost sm" id="nfAll">${t('nfAll')}</button></div>`+nfHtml(l.slice(0,8));
  $('#nfTab').innerHTML=`<div class="row" style="margin:12px 0"><button class="btn ghost sm" id="nfAll2">${t('nfAll')}</button></div>`+nfHtml(l);
  if(u){const keys=l.map(x=>x.key);if(nfSeen&&nfSeen.e==u.email)l.filter(x=>!nfSeen.k.includes(x.key)&&x.o.s=='ok').forEach(x=>toast(t('nOkT').replace('%p',x.o.p)));nfSeen={e:u.email,k:keys}}else nfSeen=null;
}
$('#nfBtn').onclick=e=>{e.stopPropagation();$('#nfMenu').classList.toggle('dim')};
const nfClick=e=>{
  const u=me();if(!u)return;
  if(e.target.closest('#nfAll,#nfAll2')){LS('sledy_nread_'+u.email,[...new Set([...nfRead(),...nfList().map(x=>x.key)])]);return nfRender()}
  const b=e.target.closest('.nfi');if(!b)return;
  LS('sledy_nread_'+u.email,[...new Set([...nfRead(),b.dataset.k])]);
  const o=(LS('sledy_orders')||[]).find(x=>x.id==b.dataset.o);$('#nfMenu').classList.add('dim');nfRender();
  if(o&&o.s!='cx')showReceipt([o]);else{tab='ord';dash()}
};
$('#nfMenu').onclick=nfClick;$('#nfTab').onclick=nfClick;

const flag=b=>'<svg viewBox="0 0 24 16" aria-hidden="true">'+b+'</svg>';

 fr:flag('<rect width="8" height="16" fill="#0055A4"/><rect x="8" width="8" height="16" fill="#fff"/><rect x="16" width="8" height="16" fill="#EF4135"/>'),

 en:flag('<rect width="24" height="16" fill="#B22234"/>'+[0,1,2,3,4,5].map(i=>`<rect y="${(1.23+i*2.46).toFixed(2)}" width="24" height="1.23" fill="#fff"/>`).join('')+'<rect width="10" height="8.6" fill="#3C3B6E"/>')};

$('#wGo').onclick=()=>{
  const u=me(),err=$('#wErr'),a=Math.floor(+$('#wAmt').value);

  if(!(a>=MINREC)){err.textContent=t('errMin');return}

if(RETURN_TX){history.replaceState(null,'',location.pathname);const u0=me();if(u0){dash();(LS('sledy_orders')||[]).filter(o=>o.u==u0.email&&o.s=='paid').forEach(o=>verify(o.id))}}
